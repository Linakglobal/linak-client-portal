<!-- LINAK Logo SVG - Converted from the provided logo -->
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Molecular Network Pattern -->
  <g transform="translate(50, 100)">
    <!-- Central large hexagon -->
    <polygon points="100,60 130,78 130,114 100,132 70,114 70,78" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="2"/>
    
    <!-- Surrounding hexagons -->
    <polygon points="40,30 55,38 55,54 40,62 25,54 25,38" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <polygon points="160,30 175,38 175,54 160,62 145,54 145,38" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <polygon points="40,150 55,158 55,174 40,182 25,174 25,158" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="1.5"/>
    <polygon points="160,150 175,158 175,174 160,182 145,174 145,158" fill="url(#logoGradient)" stroke="url(#logoGradient)" stroke-width="1.5"/>
    
    <!-- Smaller connecting hexagons -->
    <polygon points="70,15 78,19 78,27 70,31 62,27 62,19" fill="url(#logoGradient)" opacity="0.8"/>
    <polygon points="130,15 138,19 138,27 130,31 122,27 122,19" fill="url(#logoGradient)" opacity="0.8"/>
    <polygon points="30,95 38,99 38,107 30,111 22,107 22,99" fill="url(#logoGradient)" opacity="0.8"/>
    <polygon points="170,95 178,99 178,107 170,111 162,107 162,99" fill="url(#logoGradient)" opacity="0.8"/>
    
    <!-- Connecting lines -->
    <line x1="70" y1="78" x2="40" y2="54" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="78" x2="160" y2="54" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="70" y1="114" x2="40" y2="158" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="114" x2="160" y2="158" stroke="url(#logoGradient)" stroke-width="2" opacity="0.6"/>
    
    <!-- Floating particles -->
    <circle cx="20" cy="70" r="3" fill="url(#logoGradient)" opacity="0.7">
      <animate attributeName="cy" values="70;65;70" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="120" r="2.5" fill="url(#logoGradient)" opacity="0.6">
      <animate attributeName="cy" values="120;115;120" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="10" r="2" fill="url(#logoGradient)" opacity="0.8">
      <animate attributeName="cy" values="10;5;10" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- LINAK Text -->
  <g transform="translate(280, 150)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#logoGradient)">LINAK</text>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="url(#logoGradient)" opacity="0.8">MIGRATION SERVICE LLC</text>
  </g>
</svg>
