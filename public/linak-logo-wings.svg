<!-- LINAK Logo - Wings and L Emblem -->
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#DDD6FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8B5CF6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circular Background -->
  <circle cx="300" cy="200" r="120" fill="none" stroke="url(#logoGradient)" stroke-width="3" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Left Wing -->
  <g transform="translate(120, 200)">
    <path d="M0,0 Q-40,-20 -60,-10 Q-70,0 -60,10 Q-40,20 0,0 Z" fill="url(#wingGradient)" opacity="0.9"/>
    <path d="M-10,-10 Q-30,-25 -45,-20 Q-50,-10 -45,-5 Q-30,5 -10,-10 Z" fill="url(#wingGradient)" opacity="0.8"/>
    <path d="M-15,10 Q-35,25 -50,20 Q-55,10 -50,5 Q-35,-5 -15,10 Z" fill="url(#wingGradient)" opacity="0.8"/>
    <path d="M-20,-5 Q-40,-15 -50,-12 Q-52,-5 -50,0 Q-40,10 -20,-5 Z" fill="url(#wingGradient)" opacity="0.7"/>
  </g>
  
  <!-- Right Wing -->
  <g transform="translate(480, 200) scale(-1, 1)">
    <path d="M0,0 Q-40,-20 -60,-10 Q-70,0 -60,10 Q-40,20 0,0 Z" fill="url(#wingGradient)" opacity="0.9"/>
    <path d="M-10,-10 Q-30,-25 -45,-20 Q-50,-10 -45,-5 Q-30,5 -10,-10 Z" fill="url(#wingGradient)" opacity="0.8"/>
    <path d="M-15,10 Q-35,25 -50,20 Q-55,10 -50,5 Q-35,-5 -15,10 Z" fill="url(#wingGradient)" opacity="0.8"/>
    <path d="M-20,-5 Q-40,-15 -50,-12 Q-52,-5 -50,0 Q-40,10 -20,-5 Z" fill="url(#wingGradient)" opacity="0.7"/>
  </g>
  
  <!-- Central L Letter -->
  <g transform="translate(300, 200)">
    <!-- Main L shape -->
    <path d="M-25,-40 L-15,-40 L-15,20 L20,20 L20,30 L-25,30 Z" fill="url(#logoGradient)" filter="url(#glow)"/>
    
    <!-- Star/Diamond above L -->
    <g transform="translate(0, -55)">
      <path d="M0,-12 L4,0 L0,12 L-4,0 Z" fill="url(#logoGradient)" opacity="0.9"/>
      <path d="M-8,-4 L0,-8 L8,-4 L0,0 Z" fill="url(#logoGradient)" opacity="0.7"/>
    </g>
  </g>
  
  <!-- LINAK Text -->
  <g transform="translate(150, 320)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#logoGradient)" filter="url(#glow)">LINAK</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="normal" fill="url(#logoGradient)" opacity="0.8">MIGRATION SERVICE LLC</text>
  </g>
  
  <!-- Subtle glow effects -->
  <circle cx="300" cy="200" r="130" fill="none" stroke="url(#logoGradient)" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="200" r="140" fill="none" stroke="url(#logoGradient)" stroke-width="0.5" opacity="0.2"/>
</svg>
